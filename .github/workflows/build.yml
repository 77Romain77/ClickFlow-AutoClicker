name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ClickFlow/ClickFlow.csproj
      - name: Build
        run: dotnet build ClickFlow/ClickFlow.csproj --configuration Release --no-restore
      - name: Publish portable test artifact
        run: dotnet publish ClickFlow/ClickFlow.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Mark portable mode
        shell: pwsh
        run: New-Item -ItemType File -Force publish/portable.flag | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: ClickFlow-Portable-win-x64
          path: publish/
          if-no-files-found: error
