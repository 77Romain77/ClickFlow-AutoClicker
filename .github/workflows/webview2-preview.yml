name: Build WebView2 visual preview

on:
  push:
    branches: [experimental/webview2]
    paths:
      - 'webview2-preview/**'
      - '.github/workflows/webview2-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download official AutoHotkey v2
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.29/AutoHotkey_2.0.29.zip' -OutFile ahk.zip
          Expand-Archive ahk.zip -DestinationPath ahk
          $exe = Get-ChildItem ahk -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1 -ExpandProperty FullName
          if (!$exe) { throw "AutoHotkey64.exe missing" }
          "AHK_EXE=$exe" >> $env:GITHUB_ENV

      - name: Obtain official Microsoft WebView2Loader x64
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40' -OutFile webview2-sdk.zip
          Expand-Archive webview2-sdk.zip -DestinationPath webview2-sdk
          $dll = Get-ChildItem webview2-sdk -Recurse -Filter WebView2Loader.dll |
            Where-Object { $_.FullName -match '[\\/]win-x64[\\/]' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (!$dll) { throw "Microsoft WebView2Loader.dll win-x64 missing" }
          New-Item -ItemType Directory -Force 'webview2-preview/lib/WebView2/64bit' | Out-Null
          Copy-Item $dll 'webview2-preview/lib/WebView2/64bit/WebView2Loader.dll'
          Write-Host "Copied official Microsoft loader: $dll"

      - name: Validate AHK syntax
        shell: pwsh
        run: |
          $p = Start-Process -FilePath $env:AHK_EXE -ArgumentList '/ErrorStdOut', '/Validate', 'webview2-preview/ClickFlow-WebView2.ahk' -PassThru -RedirectStandardError validation.err -RedirectStandardOutput validation.out
          $completed = $p.WaitForExit(20000)
          if (-not $completed) { Stop-Process -Id $p.Id -Force }
          $stdout = if (Test-Path validation.out) { Get-Content validation.out -Raw } else { '' }
          $stderr = if (Test-Path validation.err) { Get-Content validation.err -Raw } else { '' }
          Write-Host "Exit=$($p.ExitCode) Completed=$completed"
          if ($stdout) { Write-Host "stdout: $stdout" }
          if ($stderr) { Write-Host "stderr: $stderr" }
          if (-not $completed) { throw 'AHK syntax validation timed out.' }
          if ($stdout -or $stderr -or $p.ExitCode -ne 0) { throw 'AHK syntax validation failed.' }
          Write-Host 'AHK syntax OK'

      - name: Test actual WebView2 initialization (no clicks)
        shell: pwsh
        run: |
          $env:CLICKFLOW_WEBVIEW_SMOKE_FILE = Join-Path (Get-Location) 'webview2-ready.txt'
          $p = Start-Process -FilePath $env:AHK_EXE -ArgumentList '/ErrorStdOut', 'webview2-preview/ClickFlow-WebView2.ahk' -PassThru -RedirectStandardError startup.err -RedirectStandardOutput startup.out
          try {
            Start-Sleep -Seconds 8
            $p.Refresh()
            if (Test-Path ($env:CLICKFLOW_WEBVIEW_SMOKE_FILE + '.error')) {
              throw ("WebView2 AHK startup failed: " + (Get-Content ($env:CLICKFLOW_WEBVIEW_SMOKE_FILE + '.error') -Raw))
            }
            if (!(Test-Path $env:CLICKFLOW_WEBVIEW_SMOKE_FILE)) {
              $err = if (Test-Path startup.err) { Get-Content startup.err -Raw } else { "" }
              throw "WebView2 did not initialize. $err"
            }
            if ($p.HasExited) { throw "AHK process exited with $($p.ExitCode)" }
            Write-Host "WebView2 actually initialized."
          } finally {
            $p.Refresh()
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Package complete ClickFlow preview folder
        shell: pwsh
        run: |
          Compress-Archive -Path 'webview2-preview/*' -DestinationPath 'ClickFlow-WebView2-Preview-win-x64.zip' -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: ClickFlow-WebView2-Preview-win-x64
          path: ClickFlow-WebView2-Preview-win-x64.zip

      - name: Publish preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.3.0-webview2-preview'
          if (gh release view $tag 2>$null) {
            gh release upload $tag ClickFlow-WebView2-Preview-win-x64.zip --clobber
          } else {
            gh release create $tag ClickFlow-WebView2-Preview-win-x64.zip --title 'ClickFlow WebView2 - Prototype visuel' --notes 'Prototype expérimental sans clics automatiques. Extraire le ZIP et lancer ClickFlow-WebView2.ahk avec AutoHotkey v2 64 bits. Les profils existants ne sont pas modifiés.' --target "$env:GITHUB_SHA" --prerelease
          }
