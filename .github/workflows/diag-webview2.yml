name: Diagnose AHK WebView2 startup

on:
  push:
    branches: [experimental/webview2]
    paths:
      - 'webview2-preview/diag-*.ahk'
      - '.github/workflows/diag-webview2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get official AutoHotkey v2.0.29
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.29/AutoHotkey_2.0.29.zip' -OutFile ahk.zip
          Expand-Archive ahk.zip -DestinationPath ahk
      - name: Isolate static library startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'ahk/AutoHotkey64.exe').Path
          foreach ($kind in @('basic','promise','comvar','includes','header','fullparse','try','functions','try-a','try-b','try-c','try0','minbrowser','webcall','webclass')) {
            $env:CLICKFLOW_DIAG_FILE = Join-Path (Get-Location) "$kind.marker"
            $script = (Resolve-Path "webview2-preview/diag-$kind.ahk").Path
            $p = Start-Process -FilePath $exe -ArgumentList '/ErrorStdOut', "`"$script`"" -PassThru -RedirectStandardError "$kind.err" -RedirectStandardOutput "$kind.out"
            $exited = $p.WaitForExit(5000)
            if (-not $exited) { Stop-Process -Id $p.Id -Force; Start-Sleep -Milliseconds 300 }
            $result = if (Test-Path $env:CLICKFLOW_DIAG_FILE) { Get-Content $env:CLICKFLOW_DIAG_FILE -Raw } else { 'NO_MARKER' }
            $errors = if (Test-Path "$kind.err") { Get-Content "$kind.err" -Raw } else { '' }
            $out = if (Test-Path "$kind.out") { Get-Content "$kind.out" -Raw } else { '' }
            Write-Host "DIAG $kind exited=$exited marker=$result errors=$errors stdout=$out"
          }
